[package]
name = "griot-face"
version = "0.1.0"
edition = "2021"
description = "Subtitle-style status window for the griot voice loop"

[[bin]]
name = "face"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio"] }
tokio = { version = "1", features = ["net", "io-util", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-stream = "0.3"
futures = "0.3"

[profile.release]
opt-level = 2
