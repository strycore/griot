[project]
name = "griot"
version = "0.1.0"
description = "Engine-neutral text-to-speech gateway with a voice loop"
readme = "README.md"
requires-python = ">=3.11"
# The gateway is standard library only, on purpose: it has to run on machines
# too small for a neural engine. Engines bring their own environments.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"
# voice/ is a separate component with its own venv (see voice/requirements.txt)
# and predates this config; it is not linted here yet.
extend-exclude = ["engines/chatterbox/server", "voice"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["griot"]
